<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="contenedor-formulario">
        <h1>Formulario</h1>
        <h2>Datos Personales</h2>

        <form action="/procesar-datos" method="POST">
            
            <div class="campo">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="campo">
                <label for="fechaNacimiento">Fecha de Nacimiento:</label>
                <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
            </div>

            <div class="campo">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="campo">
                <label for="telefono">Número de Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Ej: 123-456-7890">
            </div>

            <div class="campo">
                <label for="direccion">Dirección de Residencia:</label>
                <input type="text" id="direccion" name="direccion">
            </div>

            <div class="campo">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="campo">
                <button type="submit">Enviar Datos</button>
            </div>

            <div class="campo">
                <button type="button" id="btnRegresar">Regresar</button>
                <script>
                    document.getElementById("btnRegresar").onclick = function () {
                        location.href = "index.html";
                    };
                </script>
            </div>

        </form>
    </div>
 <script>
        // Capturar el evento de envío del formulario
        document.getElementById("formRegistro").addEventListener("submit", function(e) {
            e.preventDefault();

            // Obtener los valores de los campos
            const nombre = document.getElementById("nombre").value;
            const fechaNacimiento = document.getElementById("fechaNacimiento").value;
            const email = document.getElementById("email").value;
            const telefono = document.getElementById("telefono").value;
            const direccion = document.getElementById("direccion").value;
            const password = document.getElementById("password").value;

            // Obtener lista existente de usuarios o crear una nueva
            let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

            // Verificar si el correo ya está registrado
            const existe = usuarios.find(u => u.email === email);
            if (existe) {
                alert("Ya existe una cuenta registrada con este correo.");
                return;
            }

            // Crear objeto usuario
            const nuevoUsuario = {
                nombre,
                fechaNacimiento,
                email,
                telefono,
                direccion,
                password
            };

            // Guardar en localStorage
            usuarios.push(nuevoUsuario);
            localStorage.setItem("usuarios", JSON.stringify(usuarios));

            alert("Registro exitoso. Ahora puedes iniciar sesión.");
            // Redirigir al login
            window.location.href = "index.html";
        });
    </script>
</body>
</html>
